<div class="main full-dim">
    <div class="body">
        <!-- MEDIA CONTAINER -->
        <div class="media">
            <swiper style="width: 100%; height: 100%;" #main [config]="mainConfig" (click)="OnFullscreen()" (slideChange)="onSlideChange()">

            <!-- <swiper style="width: 100%; height: 100%;" #main [config]="mainConfig" (click)="OnFullscreen()"> -->
                <ng-template swiperSlide *ngFor="let media of mediaList; let i = index">
                    <img *ngIf="!this.singelItemService.changeSpotLightMedia(media).isVideo" [src]="media.image">
                    <div *ngIf="this.singelItemService.changeSpotLightMedia(media).isVideo" class="full-dim">
                        <video #videos class="full-dim video" [src]="media.image" muted></video>
                    </div>
                </ng-template>
            </swiper>
            <!-- <img *ngIf="!spotlightMedia.isVideo" [src]="spotlightMedia.media">
            <div *ngIf="spotlightMedia.isVideo" class="full-dim">
                <video class="full-dim video" [src]="spotlightMedia.media" autoplay muted></video>
            </div>-->
            <div *ngIf="showFullscreen" class="fullscreen" (click)="OnFullscreen()">
                <img src="./assets/images/fullscreen-open.png">
            </div>
        </div>

        <!-- INFO CONTAINER -->
        <div class="info" [ngStyle]="{'justify-content': mediaList.length > 1 ? 'space-between' : 'flex-start'}">
            <div class="header">{{item.name}}</div>
            <div [style]="mediaList.length > 1 ? sHeight : null" class="info-text">
                <p [innerHtml]='infoText'></p>
            </div>



            <div *ngIf="mediaList.length > 1" [style]="mHeight" class="media-chooser">
                <mat-grid-list style="width: 97%;" cols="2" rowHeight="110px" gutterSize="15px">
                    <mat-grid-tile class="media-box" *ngFor="let image of mediaList; let i = index"
                        (click)="onThumbnailClick(i)">
                        <img class="full-dim"
                            [src]="singelItemService.isRealVideo(image.image) ? image.image_md5 : image.image">
                        <div *ngIf="singelItemService.isRealVideo(image.image)" class="icon-wrapper">
                            <img src="./assets/images/play-thumbnail.png">
                        </div>
                    </mat-grid-tile>
                </mat-grid-list>
            </div>
        </div>
    </div>
    <div class=" below">
        <div class="arrow-box"></div>
    </div>
</div>
