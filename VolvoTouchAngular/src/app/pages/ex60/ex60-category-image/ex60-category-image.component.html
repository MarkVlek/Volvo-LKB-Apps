<div [ngStyle]="{'pointer-events':disabled ? 'none':'auto'}" class="main-container" (click)=selectCategory()>
    <div [@darkenOverTime]="disabled" class="img-container">
        <img src={{category.src}} />
    </div>
    <div class=category-header>
        <span>{{category.name | translate}}</span>
        <p>{{category.copy | translate}}</p>
    </div>
    <div class="spinner" *ngIf="onWait">
        <mat-spinner></mat-spinner>
    </div>
</div>
