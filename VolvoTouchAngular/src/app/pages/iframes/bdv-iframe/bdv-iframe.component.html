<div class="iframe-canvas">
    <iframe #Iframe (load)="onIframeLoaded(Iframe)" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
        [src]="url$ | async | safe" loading="lazy" frameBorder="0" allow="clipboard-read; clipboard-write"></iframe>
    <div *ngIf="showKeyboard" class="keyboard-container" (click)="parentClick()">
        <div (click)="childClick($event)" class="keyboard-container-inner">
            <app-iframe-keyboard (onClicked)="onKeyClick($event)"></app-iframe-keyboard>
        </div>
    </div>
</div>
